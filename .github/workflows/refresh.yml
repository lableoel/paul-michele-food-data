name: Refresh European food data
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate the existing pack or regenerate from the official export
        required: true
        default: validate
        type: choice
        options: [validate, refresh]
  schedule:
    - cron: '17 3 2 * *'
permissions:
  contents: write
concurrency:
  group: food-dataset-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build regional data from official export
        if: github.event_name == 'schedule' || inputs.mode == 'refresh'
        run: python3 scripts/build_dataset.py --download --source "$RUNNER_TEMP/openfoodfacts.csv.gz" --output .
      - name: Build compact pre-indexed mobile pack
        if: github.event_name == 'schedule' || inputs.mode == 'refresh'
        run: python3 scripts/build-compact-food-dataset.py --source ../food-dataset-build.sqlite --output .
      - name: Verify compact mobile pack
        run: python3 scripts/validate-compact-food-dataset.py
      - name: Verify all public rows and hashes
        run: python3 scripts/validate_dataset.py
      - name: Prune obsolete current-tree chunks after 120 days
        if: github.event_name == 'schedule' || inputs.mode == 'refresh'
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess,time
          used={p['file'] for name in ['manifest.json','manifest-v2.json'] for p in json.loads(pathlib.Path(name).read_text())['parts']}
          for p in list(pathlib.Path('.').glob('foods-*.jsonl.gz'))+list(pathlib.Path('.').glob('catalog-*.sqlite.gz')):
              stamp=subprocess.check_output(['git','log','-1','--format=%ct','--',str(p)],text=True).strip()
              if p.name not in used and stamp and time.time()-int(stamp)>120*86400:p.unlink()
          PY
      - name: Publish only verified public data
        if: github.event_name == 'schedule' || inputs.mode == 'refresh'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- manifest.json manifest-v2.json README.txt 'foods-*.jsonl.gz' 'catalog-*.sqlite.gz'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Swiss and European food facts'
          git push
